name: Finalize multi-tree beta

on:
  push:
    branches:
      - feature/multi-tree-hero
    paths:
      - .github/workflows/finalize-multi-tree.yml

permissions:
  contents: write

env:
  MODULE_DIR: potts_hero_slideshow
  ASSET_NAME: potts-hero-slideshow-1.1.0-beta.1.zip

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multi-tree-hero

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Apply tree-aware defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/finalize_multi_tree.py

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f \( -name '*.php' -o -name '*.phtml' \) -not -path './.git/*' -not -path './staging/*' -print0)
          grep -Fq "private const CUSTOM_VERSION = '1.1.0-beta.1';" PottsHeroSlideshow.php
          grep -Fq 'private function defaultsForTree(Tree $tree): array' PottsHeroSlideshow.php
          grep -Fq "\$defaults['TITLE'] = 'Welcome to ' . \$tree->title();" PottsHeroSlideshow.php
          grep -Fq "\$defaults['BUTTON_1_URL'] = \$tree_path;" PottsHeroSlideshow.php
          grep -Fq "\$defaults['BUTTON_2_URL'] = \$tree_path . '/books';" PottsHeroSlideshow.php
          test "$(cat latest-version.txt)" = '1.0.1'

      - name: Build clean beta ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging dist
          mkdir -p "staging/${MODULE_DIR}" dist
          cp module.php PottsHeroSlideshow.php metadata.json README.md CHANGELOG.md LICENSE latest-version.txt "staging/${MODULE_DIR}/"
          cp -R resources "staging/${MODULE_DIR}/"
          (cd staging && zip -qr "../dist/${ASSET_NAME}" "${MODULE_DIR}")
          unzip -t "dist/${ASSET_NAME}"
          if unzip -Z1 "dist/${ASSET_NAME}" | grep -Ev "^${MODULE_DIR}/"; then
            echo 'Beta ZIP contains files outside the module root.' >&2
            exit 1
          fi
          unzip -p "dist/${ASSET_NAME}" "${MODULE_DIR}/PottsHeroSlideshow.php" | grep -Fq "private const CUSTOM_VERSION = '1.1.0-beta.1';"
          sha256sum "dist/${ASSET_NAME}" | tee "dist/${ASSET_NAME}.sha256"

      - name: Upload clean beta package
        uses: actions/upload-artifact@v4
        with:
          name: potts-hero-slideshow-1.1.0-beta.1-clean
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/${{ env.ASSET_NAME }}.sha256
          if-no-files-found: error

      - name: Commit source cleanup only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging dist
          git rm -rf --ignore-unmatch staging dist
          git rm --ignore-unmatch .github/workflows/finalize-multi-tree.yml tools/finalize_multi_tree.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PottsHeroSlideshow.php
          git commit -m 'Refine multi-tree defaults and remove build artifacts'
          git push origin HEAD:feature/multi-tree-hero
