name: Build multi-tree beta

on:
  push:
    branches:
      - feature/multi-tree-hero
    paths:
      - .github/workflows/build-multi-tree.yml

permissions:
  contents: write

env:
  VERSION: 1.1.0-beta.1
  MODULE_DIR: potts_hero_slideshow
  ASSET_NAME: potts-hero-slideshow-1.1.0-beta.1.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multi-tree-hero

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Ensure gettext tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v msgfmt >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y gettext
          fi

      - name: Implement per-tree configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_multi_tree.py
          msgfmt --check resources/lang/nl.po -o resources/lang/nl.mo

      - name: Validate PHP and multi-tree invariants
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f \( -name '*.php' -o -name '*.phtml' \) -not -path './.git/*' -print0)

          grep -Fq "private const CUSTOM_VERSION = '1.1.0-beta.1';" PottsHeroSlideshow.php
          grep -Fq '"version": "1.1.0-beta.1"' metadata.json
          test "$(cat latest-version.txt)" = '1.0.1'
          grep -Fq 'private function settings(Tree $tree): array' PottsHeroSlideshow.php
          grep -Fq 'private function slides(Tree $tree): array' PottsHeroSlideshow.php
          grep -Fq "return 'TREE_' . \$tree->id() . '_' . \$key;" PottsHeroSlideshow.php
          grep -Fq "return \$this->legacyImageDirectory() . 'tree-' . \$tree->id() . '/';" PottsHeroSlideshow.php
          grep -Fq "'tree_id' => (string) \$tree->id()," PottsHeroSlideshow.php
          grep -Fq 'name="tree_id" value="<?= e($selected_tree_id) ?>"' resources/views/admin/settings.phtml
          grep -Fq 'msgstr "Stamboom"' resources/lang/nl.po

          if grep -Fq '$this->settings()' PottsHeroSlideshow.php; then
            echo 'Found unscoped settings() call.' >&2
            exit 1
          fi
          if grep -Fq '$this->slides()' PottsHeroSlideshow.php; then
            echo 'Found unscoped slides() call.' >&2
            exit 1
          fi
          if grep -Fq '$this->imageDirectory()' PottsHeroSlideshow.php; then
            echo 'Found unscoped imageDirectory() call.' >&2
            exit 1
          fi

      - name: Build beta install ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging dist
          mkdir -p "staging/${MODULE_DIR}" dist
          cp module.php PottsHeroSlideshow.php metadata.json README.md CHANGELOG.md LICENSE latest-version.txt "staging/${MODULE_DIR}/"
          cp -R resources "staging/${MODULE_DIR}/"
          (
            cd staging
            zip -qr "../dist/${ASSET_NAME}" "${MODULE_DIR}"
          )
          unzip -t "dist/${ASSET_NAME}"
          if unzip -Z1 "dist/${ASSET_NAME}" | grep -Ev "^${MODULE_DIR}/"; then
            echo 'Beta ZIP contains files outside the required module root.' >&2
            exit 1
          fi
          unzip -p "dist/${ASSET_NAME}" "${MODULE_DIR}/PottsHeroSlideshow.php" | grep -Fq "private const CUSTOM_VERSION = '1.1.0-beta.1';"
          unzip -Z1 "dist/${ASSET_NAME}" | grep -Fxq "${MODULE_DIR}/resources/lang/nl.mo"
          sha256sum "dist/${ASSET_NAME}" | tee "dist/${ASSET_NAME}.sha256"

      - name: Upload beta validation package
        uses: actions/upload-artifact@v4
        with:
          name: potts-hero-slideshow-1.1.0-beta.1
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/${{ env.ASSET_NAME }}.sha256
          if-no-files-found: error

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/build-multi-tree.yml tools/apply_multi_tree.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement per-tree hero configuration'
          git push origin HEAD:feature/multi-tree-hero
